system:
  pi_host: 10.47.0.2
  telemetry_port: 29100

ssh:
  port: 22
  username: tms
  password: tms
  remember_password: true
  connect_timeout_sec: 10
  keepalive_interval_sec: 5

nano:
  port: auto
  baudrate: 115200
  heartbeat_timeout_sec: 2

daq:
  device: /dev/daq0
  sample_rate: 5000
  block_ms: 10

channels:
  thrust:
    channel: 0
    scale: 0.01
    offset: 0.0
  pressure:
    channel: 1
    scale: 0.001
    offset: 0.0

# AI1 pressure transmitter electrical input. The field wiring uses a 100 Ω
# shunt: 4–20 mA becomes 0.4–2.0 V at the USB-4704 AI1 input. The pressure
# scale/offset above are still fitted from known reference pressures.
pressure_input:
  shunt_ohms: 100.0
  loop_min_mA: 4.0
  loop_max_mA: 20.0

# Additional archival *_lpf datasets. Live display/CSV/result analysis use
# the shared 80-sample moving average (*_ma), independently of these settings.
# Existing raw_* and unfiltered physical datasets are retained unchanged.
low_pass:
  enabled: true
  cutoff_hz: 50.0

logging:
  directory: logs
  pi_directory: /var/lib/tusi-tms/logs
  ring_buffer_sec: 5
  flush_interval_sec: 1
