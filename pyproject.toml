[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tusi-tms"
version = "0.1.0"
description = "TUSI rocket-engine test measurement system"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.6",
    "numpy>=1.21",
    "pyserial>=3.5",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dashboard = ["asyncssh>=2.5", "PySide6>=6.5", "pyqtgraph>=0.13"]
package = ["PyInstaller>=6.0"]

[project.scripts]
tms-agent = "pi.service:main"
tms-agent-selftest = "pi.tms_agent:main"
tusi-tms = "laptop.main:main"

[tool.setuptools.packages.find]
include = ["common*", "pi*", "laptop*"]

[tool.setuptools.package-data]
"laptop.gui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
